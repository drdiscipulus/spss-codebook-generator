[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spss-codebook-rescue"
version = "0.1.0"
description = "Portable Windows app for extracting SPSS metadata into R-friendly codebooks."
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.12,<3.13"
authors = [
    { name = "drdiscipulus" },
]
keywords = ["spss", "codebook", "sav", "zsav", "r", "metadata"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "openpyxl>=3.1",
    "pandas>=2.2",
    "pyreadstat>=1.2",
    "PySide6>=6.7",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.0",
    "pytest>=8.0",
    "ruff>=0.12",
]

[project.scripts]
spss-codebook-rescue = "spss_codebook.cli:main"

[project.gui-scripts]
spss-codebook-rescue-gui = "spss_codebook.gui:main"

[project.urls]
Homepage = "https://github.com/drdiscipulus/spss_codebook_generator"
Repository = "https://github.com/drdiscipulus/spss_codebook_generator"
Issues = "https://github.com/drdiscipulus/spss_codebook_generator/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
