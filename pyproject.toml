[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spss-codebook-generator"
version = "0.1.0"
description = "Portable SPSS codebook generator for R-friendly Excel and CSV exports."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
    { name = "drdiscipulus" },
]
keywords = ["spss", "codebook", "sav", "zsav", "r", "metadata"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "openpyxl>=3.1",
    "pandas>=2.2",
    "pyreadstat>=1.2",
    "PySide6>=6.7",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.0",
    "pytest>=8.0",
]

[project.scripts]
spss-codebook = "spss_codebook.cli:main"
spss-codebook-gui = "spss_codebook.gui:main"

[project.urls]
Homepage = "https://github.com/drdiscipulus/spss-codebook-generator"
Repository = "https://github.com/drdiscipulus/spss-codebook-generator"
Issues = "https://github.com/drdiscipulus/spss-codebook-generator/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
